<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Remote Body Outline -->
  <rect x="160" y="56" width="192" height="400" rx="42" fill="#1e293b" stroke="#334155" stroke-width="6" />
  
  <!-- Dual LED Emitter indicator at top -->
  <circle cx="230" cy="85" r="7" fill="#f59e0b" />
  <circle cx="282" cy="85" r="7" fill="#06b6d4" />

  <!-- D-Pad Ring -->
  <circle cx="256" cy="200" r="64" fill="#0f172a" stroke="#334155" stroke-width="5" />
  <!-- Center Select button -->
  <circle cx="256" cy="200" r="28" fill="#38bdf8" />
  <path d="M256 148 L256 164" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <path d="M256 236 L256 252" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <path d="M204 200 L220 200" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <path d="M292 200 L308 200" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />

  <!-- Dual Signal Waves (Toshiba TV & Firestick 4K Max) -->
  <path d="M120 120 C 130 90, 160 70, 190 65" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.85" />
  <path d="M100 140 C 115 90, 155 60, 190 50" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-dasharray="4,6" opacity="0.5" />

  <path d="M392 120 C 382 90, 352 70, 322 65" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.85" />
  <path d="M412 140 C 397 90, 357 60, 322 50" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" stroke-dasharray="4,6" opacity="0.5" />

  <!-- Remote Buttons Grid -->
  <!-- Row 1: Back, Home, Menu -->
  <circle cx="202" cy="296" r="15" fill="#334155" />
  <circle cx="256" cy="296" r="15" fill="#334155" />
  <circle cx="310" cy="296" r="15" fill="#334155" />

  <!-- Row 2: Media playback -->
  <circle cx="202" cy="344" r="13" fill="#334155" />
  <circle cx="256" cy="344" r="13" fill="#334155" />
  <circle cx="310" cy="344" r="13" fill="#334155" />

  <!-- Volume Rocker Bar (TV side) -->
  <rect x="195" y="380" width="40" height="46" rx="8" fill="#f59e0b" opacity="0.9" />
  <!-- Input Switcher Bar (TV side) -->
  <rect x="277" y="380" width="40" height="46" rx="8" fill="#06b6d4" opacity="0.9" />

  <!-- Stylized "D" Logo badge -->
  <text x="256" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1">D•REMOTE</text>
</svg>
